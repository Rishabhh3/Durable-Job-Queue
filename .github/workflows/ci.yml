name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    # A real Postgres, because the whole project depends on row locking
    # that no lighter database has. The credentials and database name match
    # what tests/conftest.py connects to.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: djq
          POSTGRES_PASSWORD: djq
          POSTGRES_DB: djq_test
        ports:
          - 5432:5432
        # Without this the test step can start before Postgres is ready
        # and fail on connection refused.
        options: >-
          --health-cmd "pg_isready -U djq"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Lint
        run: ruff check .

      - name: Types
        run: mypy djq

      - name: Tests
        run: pytest -q
