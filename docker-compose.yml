services:
  postgres:
    image: postgres:17-alpine
    container_name: djq-postgres
    environment:
      POSTGRES_USER: djq
      POSTGRES_PASSWORD: djq
      POSTGRES_DB: djq_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/10-init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U djq -d djq_dev"]
      interval: 2s
      timeout: 3s
      retries: 15
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - log_min_duration_statement=200

volumes:
  pgdata: